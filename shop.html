<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; }
.shop { max-width: 480px; margin: 0 auto; background: #f5f5f0; min-height: 100vh; }
.topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 10; }
.topbar-title { font-size: 17px; font-weight: 600; color: #111; }
.topbar-sub { font-size: 12px; color: #888; margin-top: 2px; }
.cart-btn { position: absolute; top: 14px; right: 16px; background: #1a7a4a; color: #fff; border: none; border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.cart-btn .badge { background: #fff; color: #1a7a4a; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.filters { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 10px 16px 12px; }
.filter-label { font-size: 11px; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; max-height: 76px; overflow-y: auto; }
.pill { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: #f5f5f5; color: #555; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.pill.active { background: #1a7a4a; color: #fff; border-color: #1a7a4a; }
.filter-gap { height: 8px; }
.result-count { font-size: 12px; color: #999; padding: 8px 16px 0; }
.products { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.product-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.product-img-wrap { flex-shrink: 0; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: #f5f5f0; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.product-img-wrap .fallback { font-size: 32px; display: flex; align-items: center; justify-content: center; }
.lightbox-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 24px; }
.lightbox-content { max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; }
.lightbox-content img { max-width: 100%; max-height: 70vh; border-radius: 12px; background: #fff; }
.lightbox-caption { color: #fff; text-align: center; margin-top: 14px; }
.lightbox-caption .lb-name { font-size: 16px; font-weight: 600; }
.lightbox-caption .lb-brand { font-size: 13px; color: #bbb; margin-top: 4px; }
.lightbox-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 26px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; line-height: 1; }
.product-info { flex: 1; min-width: 0; }
.product-brand { font-size: 10px; color: #1a7a4a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.product-name { font-size: 14px; font-weight: 500; color: #111; margin-top: 2px; line-height: 1.3; }
.product-meta { font-size: 12px; color: #999; margin-top: 3px; }
.product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.product-price { font-size: 16px; font-weight: 600; color: #111; }
.add-btn { background: #1a7a4a; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.card-stepper { display: flex; align-items: center; gap: 8px; background: #f5f5f0; border-radius: 20px; padding: 3px; }
.card-stepper .qty-btn { width: 26px; height: 26px; }
.empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 14px; }
.cart-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; }
.cart-sheet { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.cart-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto 0; }
.cart-head { position: relative; padding: 12px 16px 8px; }
.cart-head-title { font-size: 16px; font-weight: 600; color: #111; }
.close-btn { position: absolute; top: 10px; right: 14px; background: none; border: none; font-size: 24px; color: #aaa; cursor: pointer; line-height: 1; }
.cart-items { overflow-y: auto; flex: 1; padding: 0 16px; }
.cart-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; }
.cart-thumb { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: #f5f5f0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cart-thumb .fallback { font-size: 22px; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 13px; color: #111; }
.cart-item-brand { font-size: 11px; color: #aaa; }
.cart-qty { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; background: #f5f5f5; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #333; }
.qty-num { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }
.cart-item-price { font-size: 14px; font-weight: 500; color: #111; min-width: 52px; text-align: right; }
.cart-footer { padding: 14px 16px; border-top: 1px solid #eee; }
.cart-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; color: #111; margin-bottom: 12px; }
.wa-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #25d366; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.clear-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 12px; background: transparent; color: #c0392b; font-size: 13px; font-weight: 500; cursor: pointer; }
.clear-btn:hover { background: #fdf0ee; }
.hidden { display: none !important; }
</style>

const BRAND_LABELS = {
  "Bellamys Organic": "Bellamy's Organic",
  "Macro Organics":   "Macro Organics",
  "Only Organics":    "Only Organics",
  "Rafferty's Garden": "Rafferty's Garden",
  "Little Bellies":   "Little Bellies"
};

const BRANDS = ["All", ...Array.from(new Set(PRODUCTS.map(p=>p.brand)))];
const AGE_ORDER = ["4+ months","5+ months","6+ months","7+ months","8+ months","9+ months","10+ months","12+ months","1+ years","1-3 years","1-5 years","3+ years"];
const AGES = ["All", ...AGE_ORDER.filter(a => PRODUCTS.some(p=>p.age===a))];

let activeBrand = "All", activeAge = "All", cart = {};

const CART_KEY = "organics_baby_cart_v1";
try { cart = JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch (e) { cart = {}; }

function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {}
}

function imgOrFallback(p, size) {
  return `<span class="fallback">${p.emoji}</span><img src="${p.img}" alt="${p.name}" width="${size}" height="${size}" style="display:none" onload="this.style.display='block';this.previousElementSibling.style.display='none'" onerror="this.remove()">`;
}

function buildFilters() {
  document.getElementById("brand-filters").innerHTML =
    BRANDS.map(b => `<button class="pill${b===activeBrand?' active':''}" onclick="setBrand('${b.replace(/'/g,"\\'")}')">${BRAND_LABELS[b]||b}</button>`).join("");
  document.getElementById("age-filters").innerHTML =
    AGES.map(a => `<button class="pill${a===activeAge?' active':''}" onclick="setAge('${a}')">${a}</button>`).join("");
}

function filtered() {
  return PRODUCTS.filter(p =>
    (activeBrand === "All" || p.brand === activeBrand) &&
    (activeAge   === "All" || p.age   === activeAge)
  );
}

function renderProducts() {
  const list = document.getElementById("product-list");
  const items = filtered();
  document.getElementById("result-count").textContent = items.length + " product" + (items.length===1?"":"s");
  if (!items.length) { list.innerHTML = '<div class="empty">No products match your filters.</div>'; return; }
  list.innerHTML = items.map(p => {
    const inCart = cart[p.id] || 0;
    return `<div class="product-card">
      <div class="product-img-wrap" onclick="openLightbox(${p.id})">${imgOrFallback(p, 72)}</div>
      <div class="product-info">
        <div class="product-brand">${BRAND_LABELS[p.brand]||p.brand}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-meta">${p.age}</div>
        <div class="product-footer">
          <div class="product-price">$${p.price.toFixed(2)}</div>
          ${inCart>0
            ? `<div class="card-stepper">
                <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
                <span class="qty-num">${inCart}</span>
                <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
              </div>`
            : `<button class="add-btn" onclick="addToCart(${p.id})">+ Add</button>`
          }
        </div>
      </div>
    </div>`;
  }).join("");
}

function setBrand(b) { activeBrand = b; buildFilters(); renderProducts(); }
function setAge(a)   { activeAge   = a; buildFilters(); renderProducts(); }

function addToCart(id) {
  cart[id] = (cart[id]||0) + 1;
  saveCart();
  updateCartBadge(); renderProducts();
}

function updateCartBadge() {
  document.getElementById("cart-badge").textContent =
    Object.values(cart).reduce((a,b) => a+b, 0);
}

function openLightbox(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  document.getElementById("lightbox-img").src = p.img;
  document.getElementById("lightbox-img").alt = p.name;
  document.getElementById("lightbox-name").textContent = p.name;
  document.getElementById("lightbox-brand").textContent = (BRAND_LABELS[p.brand]||p.brand) + " · " + p.age;
  document.getElementById("lightbox-overlay").classList.remove("hidden");
}
function closeLightbox() { document.getElementById("lightbox-overlay").classList.add("hidden"); }
function closeLightboxOutside(e) { if (e.target.id === "lightbox-overlay") closeLightbox(); }

function openCart()  { renderCartSheet(); document.getElementById("cart-overlay").classList.remove("hidden"); }
function closeCart() { document.getElementById("cart-overlay").classList.add("hidden"); }
function closeCartOutside(e) { if (e.target.id === "cart-overlay") closeCart(); }

function renderCartSheet() {
  const items = Object.entries(cart).filter(([,q]) => q > 0);
  const el = document.getElementById("cart-items-list");
  if (!items.length) {
    el.innerHTML = '<div class="empty" style="padding:24px">Your cart is empty</div>';
    document.getElementById("cart-total").textContent = "$0.00";
    return;
  }
  let total = 0;
  el.innerHTML = items.map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    total += p.price * qty;
    return `<div class="cart-item">
      <div class="cart-thumb">${imgOrFallback(p, 44)}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-brand">${BRAND_LABELS[p.brand]||p.brand}</div>
      </div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
      </div>
      <div class="cart-item-price">$${(p.price*qty).toFixed(2)}</div>
    </div>`;
  }).join("");
  document.getElementById("cart-total").textContent = "$" + total.toFixed(2);
}

function clearCart() {
  if (!confirm("Remove all items from your cart?")) return;
  cart = {};
  saveCart();
  updateCartBadge(); renderCartSheet(); renderProducts();
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id]||0) + delta);
  if (cart[id] === 0) delete cart[id];
  saveCart();
  updateCartBadge(); renderCartSheet(); renderProducts();
}

function sendWhatsApp() {
  const items = Object.entries(cart).filter(([,q]) => q > 0);
  if (!items.length) { alert("Your cart is empty!"); return; }
  let total = 0;
  let msg = "Hi! I would like to order the following:\n\n";
  items.forEach(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    total += p.price * qty;
    msg += "- " + p.name + " (" + (BRAND_LABELS[p.brand]||p.brand) + ") x" + qty + " = $" + (p.price * qty).toFixed(2) + "\n";
  });
  msg += "\nTotal: $" + total.toFixed(2);
  msg += "\n\nPlease confirm availability and delivery. Thank you!";
  window.open("https://api.whatsapp.com/send?phone=61451656856&text=" + encodeURIComponent(msg), "_blank");
}

buildFilters();
renderProducts();
updateCartBadge();
